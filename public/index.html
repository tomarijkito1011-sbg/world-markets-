<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Markets — 世界の株式市場</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Markets">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">🌍</span><span>World Markets<small>世界の株式市場を一目で</small></span></a>
  <div class="seg" role="tablist" aria-label="地図の表示切り替え">
    <button id="btn-globe" class="active" aria-pressed="true">🌐 3D地球儀</button>
    <button id="btn-flat" aria-pressed="false">🗺️ 平面地図</button>
  </div>
  <div class="spacer"></div>
  <div class="clock"><div id="clock"></div><div><span class="live-dot"></span><span id="updated">読み込み中…</span></div></div>
</header>

<section class="map-wrap" id="map-wrap">
  <div id="globe"></div>
  <div id="flat" hidden></div>
  <div class="loading" id="loading">株価を読み込み中…</div>
  <div class="legend">
    前日比
    <div class="bar"></div>
    <div class="ticks num"><span>−3%</span><span>0</span><span>+3%</span></div>
  </div>
  <div class="hint" id="hint">ドラッグで回転・ホイールで拡大 ／ 国をクリックで詳細</div>
</section>

<main class="container">
  <div class="summary" id="summary"></div>
  <h2 class="sec">市場一覧 <span class="count" id="count"></span></h2>
  <div class="region-grid" id="list"></div>
  <p class="foot">
    株価データ: Yahoo Finance（非公式取得）。開場中の市場は約15秒ごとに自動更新します。市場によっては数分〜20分程度遅れることがあります。<br>
    TOPIXは指数を直接取得できないため、連動ETF（1306）の値動きで表示しています。祝日の休場は、株価の更新状況から推定しています。<br>
    このサイトは情報提供のみを目的としており、投資判断はご自身の責任で行ってください。
  </p>
</main>

<div class="tip" id="tip"></div>

<script src="/vendor/d3.min.js"></script>
<script src="/vendor/topojson-client.min.js"></script>
<script src="/vendor/globe.gl.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
